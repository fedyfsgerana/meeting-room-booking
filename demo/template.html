      activity: [{ at: stamp(), user: "Sistem", action: "Data demo", tone: "info", module: "Sistem", target: "Data contoh dimuat", detail: "" }],
      seq: { booking: 6, room: 5, note: 1 },
    };
  }

  let db = load();
  let me = null;
  const ui = { menu: null, tables: {}, theme: readTheme() };

  function load() {
    try { const raw = localStorage.getItem(STORE); if (raw) return JSON.parse(raw); } catch {}
    const data = seed();
    persist(data);
    return data;
  }
  function persist(data = db) { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch {} }
  function readTheme() { try { const t = localStorage.getItem("mrb-theme"); return t === "light" || t === "dark" ? t : "system"; } catch { return "system"; } }
  function applyTheme(t) {
    ui.theme = t;
    if (t === "system") { delete document.documentElement.dataset.theme; try { localStorage.removeItem("mrb-theme"); } catch {} }
    else { document.documentElement.dataset.theme = t; try { localStorage.setItem("mrb-theme", t); } catch {} }
  }

  const user = (id) => db.users.find((u) => u.id === id);
  const room = (id) => db.rooms.find((r) => r.id === id);
  const dept = (id) => db.departments.find((d) => d.id === id);
  const can = (page) => me && ROLE[me.role].pages.includes(page);

  function log(action, tone, module, target, detail = "") {
    db.activity.unshift({ at: stamp(), user: me ? me.name : "Sistem", action, tone, module, target, detail });
    db.activity = db.activity.slice(0, 300);
  }
  function notifyUsers(userIds, title, body, href) {
    for (const userId of new Set(userIds)) db.notifications.unshift({ id: db.seq.note++, userId, title, body, href, read: false, at: stamp() });
  }

  function statusOf(b) {
    if (b.status === "approved" && new Date(`${b.date}T${toTime(b.end)}:00`) < new Date()) return "done";
    return b.status;
  }
  const badge = (label, tone) => `<span class="badge b-${tone}"><span class="badge-dot" aria-hidden="true"></span>${esc(label)}</span>`;
  const statusBadge = (s) => badge(STATUS[s][0], STATUS[s][1]);

  function approvalQueue(mode) {
    if (!me) return [];
    if (mode === "approver") return db.bookings.filter((b) => b.status === "draft" && (me.role === "admin" || (me.role === "approver" && me.approves.includes(b.departmentId))));
    return db.bookings.filter((b) => b.status === "pic" && (me.role === "admin" || (me.role === "pic" && room(b.roomId)?.picId === me.id)));
  }

  function availability({ roomId, date, start, end, exclude }) {
    const r = room(roomId);
    if (!r) return ["wait", "Pilih ruang, tanggal, dan jam untuk melihat ketersediaan."];
    if (r.status !== "active") return ["bad", `${r.name} sedang perbaikan dan tidak bisa dipesan.`];
    if (!date || Number.isNaN(start) || Number.isNaN(end)) return ["wait", "Pilih ruang, tanggal, dan jam untuk melihat ketersediaan."];
    if (new Date(`${date}T00:00:00`).getDay() === 0) return ["bad", "Hari Minggu bukan hari operasional."];
    if (date < today() || (date === today() && start < nowMin())) return ["bad", "Waktu yang dipilih sudah lewat."];
    if (!(start < end)) return ["bad", "Jam selesai harus setelah jam mulai."];
    if (start < OPEN || end > CLOSE) return ["bad", `Di luar jam operasional ${clock(OPEN)}–${clock(CLOSE)}.`];
    const clash = db.bookings.find((b) => b.id !== exclude && b.roomId === roomId && b.date === date && ACTIVE.includes(b.status) && b.start < end && start < b.end);
    if (clash) return ["bad", `Ruang sudah dipakai ${clock(clash.start)}–${clock(clash.end)} untuk "${clash.topic}".`];
    return ["ok", `${r.name} tersedia ${clock(start)}–${clock(end)}.`];
  }

  const layer = document.getElementById("layer");
  const closeLayer = () => { layer.innerHTML = ""; };

  function statusModal(message, tone = "success") {
    const T = { success: ["Berhasil", "check", "success", "Oke"], error: ["Gagal", "circleAlert", "danger", "Tutup"], warning: ["Perhatian", "triangle", "warn", "Mengerti"], info: ["Informasi", "info", "primary", "Mengerti"] }[tone];
    layer.innerHTML = `<div class="backdrop" data-close><div class="status-modal" role="alertdialog" aria-modal="true" aria-labelledby="st-title" tabindex="-1">
      <button type="button" class="status-close" aria-label="Tutup" title="Tutup" data-close>${icon("x")}</button>
      <span class="status-ic ${tone}">${icon(T[1])}</span><h2 id="st-title">${T[0]}</h2><p>${esc(message)}</p>
      <div class="status-actions"><button type="button" class="btn btn-${T[2]}" data-close>${icon(tone === "error" ? "x" : "check")}${T[3]}</button></div>
    </div></div>`;
    layer.querySelector(".status-actions .btn").focus();
  }

  function confirmDialog({ title, description, label, iconName, tone, summary = [], reason = null, onConfirm }) {
    const centerTone = { primary: "info", success: "success", danger: "error", warn: "warning" }[tone];
    layer.innerHTML = `<div class="backdrop" data-close><div class="status-modal" role="dialog" aria-modal="true" aria-labelledby="cf-title" tabindex="-1">
      <button type="button" class="status-close" aria-label="Tutup" title="Tutup" data-close>${icon("x")}</button>
      <span class="status-ic ${centerTone}">${icon(iconName)}</span><h2 id="cf-title">${esc(title)}</h2><p>${esc(description)}</p>
      ${summary.length ? `<dl class="confirm-summary">${summary.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl>` : ""}
      ${reason ? `<div class="confirm-body"><div class="field"><label for="cf-reason">${esc(reason)} <span class="req">*</span></label><textarea class="textarea" id="cf-reason" rows="2" maxlength="300" placeholder="Masukkan alasan"></textarea><div class="hint">Minimal 3 karakter.</div></div><p class="confirm-note">${icon("info")}Alasan tersimpan di Riwayat aktivitas.</p></div>` : ""}
      <div class="status-actions"><button type="button" class="btn btn-secondary" data-close>${icon("arrowLeft")}Kembali</button><button type="button" class="btn btn-${tone}" data-confirm${reason ? " disabled" : ""}>${icon(iconName)}${esc(label)}</button></div>
    </div></div>`;
    const ok = layer.querySelector("[data-confirm]");
    const text = layer.querySelector("#cf-reason");
    if (text) { text.addEventListener("input", () => { ok.disabled = text.value.trim().length < 3; }); text.focus(); }
    else layer.querySelector(".status-modal").focus();
    ok.addEventListener("click", () => {
      const message = onConfirm(text ? text.value.trim() : null);
      persist();
      render();
      if (message) statusModal(message, "success");
    });
  }

  function cancelBooking(id) {
    const b = db.bookings.find((x) => x.id === id);
    confirmDialog({
      title: "Batalkan booking?", description: `${b.topic}. Ruang kembali tersedia untuk orang lain.`, label: "Batalkan booking", iconName: "circleX", tone: "danger",
      summary: [["Ruang", room(b.roomId).name], ["Jadwal", `${shortDate(b.date)} · ${clock(b.start)}–${clock(b.end)}`]], reason: "Alasan pembatalan",
      onConfirm: (reason) => {
        b.status = "cancelled"; b.reason = reason; b.events.push({ label: "Dibatalkan", actor: me.name, at: stamp(), note: reason });
        log("Batalkan", "bad", "Booking", b.topic, reason);
        return "Booking dibatalkan. Ruang kembali tersedia.";
      },
    });
  }

  function decide(id, mode, approve) {
    const b = db.bookings.find((x) => x.id === id);
    const summary = [["Ruang", room(b.roomId).name], ["Jadwal", `${shortDate(b.date)} · ${clock(b.start)}–${clock(b.end)}`], ["Pemesan", `${user(b.requesterId).name} · ${dept(b.departmentId).code}`]];
    if (!approve) {
      return confirmDialog({
        title: "Tolak booking?", description: `${b.topic} oleh ${user(b.requesterId).name}. Ruang kembali tersedia.`, label: "Tolak", iconName: "x", tone: "danger", summary, reason: "Alasan penolakan",
        onConfirm: (reason) => {
          b.status = "rejected"; b.reason = reason; b.events.push({ label: "Ditolak", actor: me.name, at: stamp(), note: reason });
          notifyUsers([b.requesterId], "Booking ditolak", `${b.topic}: ${reason}`, `#/booking/${b.id}`);
          log("Tolak", "bad", "Persetujuan", b.topic, `${MODE[mode].label}: ${reason}`);
          return "Booking ditolak. Ruang kembali tersedia.";
        },
      });
    }
    confirmDialog({
      title: mode === "approver" ? "Setujui booking?" : "Ruang dan perlengkapan siap?",
      description: mode === "approver" ? `${b.topic} oleh ${user(b.requesterId).name}. Booking diteruskan ke Penanggung Jawab Ruang untuk cek kesiapan ruang.` : `${room(b.roomId).name} untuk ${b.topic}. Booking menjadi Disetujui dan ruang dipakai sesuai jadwal.`,
      label: mode === "approver" ? "Setujui" : "Ruang siap", iconName: mode === "approver" ? "circleCheck" : "clipboardCheck", tone: "success", summary,
      onConfirm: () => {
        if (mode === "approver") {
          b.status = "pic"; b.events.push({ label: "Disetujui penyetuju", actor: me.name, at: stamp() });
          notifyUsers([room(b.roomId).picId], "Cek kesiapan ruang", `${b.topic} · ${room(b.roomId).name}`, "#/persetujuan?tahap=pic");
          log("Setujui", "ok", "Persetujuan", b.topic, "Penyetuju");
          return "Booking disetujui dan diteruskan ke Penanggung Jawab Ruang.";
        }
        b.status = "approved"; b.events.push({ label: "Dicek Penanggung Jawab Ruang", actor: me.name, at: stamp() });
        notifyUsers([b.requesterId], "Booking disetujui", `${b.topic} · ${room(b.roomId).name}`, `#/booking/${b.id}`);
        log("Ruang siap", "ok", "Persetujuan", b.topic, "Penanggung Jawab Ruang");
        return "Ruang siap. Booking disetujui.";
      },
    });
  }

  function deleteRoom(id) {
    const r = room(id);
    confirmDialog({
      title: "Hapus ruangan?", description: `${r.name} dihapus dari daftar ruangan dan tidak bisa dipesan lagi.`, label: "Hapus ruangan", iconName: "trash", tone: "danger",
      summary: [["Lokasi", r.location], ["Kapasitas", `${r.capacity} orang`]], reason: "Alasan penghapusan",
      onConfirm: (reason) => {
        db.rooms = db.rooms.filter((x) => x.id !== id);
        log("Hapus", "bad", "Ruangan", r.name, reason);
        return "Ruangan dihapus.";
      },
    });
  }

  function confirmLogout() {
    confirmDialog({
      title: "Keluar dari aplikasi?", description: "Sesi di perangkat ini diakhiri. Anda perlu masuk lagi untuk memakai aplikasi.", label: "Keluar", iconName: "logOut", tone: "danger",
      onConfirm: () => { log("Logout", "gray", "Login dan sesi", me.name); me = null; sessionStorage.removeItem(SESSION); location.hash = "#/"; return null; },
    });
  }

  function table(id, { rows, columns, actions, searchText, placeholder, filters, unit, empty, extra = "" }) {
    const st = (ui.tables[id] ??= { q: "", filter: filters ? filters[0].value : null, sort: null, page: 1, size: 10 });
    const q = st.q.trim().toLowerCase();
    const searched = q ? rows.filter((r) => searchText(r).toLowerCase().includes(q)) : rows;
    const active = filters?.find((f) => f.value === st.filter);
    const filtered = active ? searched.filter(active.test) : searched;
    const col = st.sort && columns.find((c) => c.key === st.sort.key);
    const sorted = col ? [...filtered].sort((a, b) => { const x = col.sort(a), y = col.sort(b); return (x < y ? -1 : x > y ? 1 : 0) * (st.sort.dir === "desc" ? -1 : 1); }) : filtered;
    const pages = Math.max(1, Math.ceil(sorted.length / st.size));
    st.page = Math.min(st.page, pages);
    const pageRows = sorted.slice((st.page - 1) * st.size, st.page * st.size);
    const start = sorted.length ? (st.page - 1) * st.size + 1 : 0;
    const end = Math.min(sorted.length, st.page * st.size);
    const seg = filters && filters.length > 1 ? `<div class="seg" role="group" aria-label="Filter">${filters.map((f) => `<button type="button" class="${f.value === st.filter ? "active" : ""}" aria-pressed="${f.value === st.filter}" data-t-filter="${id}:${f.value}">${esc(f.label)}<span class="n">${searched.filter(f.test).length}</span></button>`).join("")}</div>` : "";
    const head = columns.map((c) => {
      const on = st.sort?.key === c.key;
      const ic = on ? (st.sort.dir === "asc" ? "arrowUp" : "arrowDown") : "sort";
      return `<th class="${c.cls || ""}">${c.sort ? `<button type="button" class="sort${on ? " active" : ""}" data-t-sort="${id}:${c.key}">${esc(c.header)}${icon(ic)}</button>` : esc(c.header)}</th>`;
    }).join("");
    const body = pageRows.map((r, i) => `<tr><td class="num-col">${start + i}</td>${columns.map((c) => `<td class="${c.cls || ""}" data-label="${esc(c.header)}">${c.render(r)}</td>`).join("")}${actions ? `<td class="ta-r"><div class="row-acts">${actions(r)}</div></td>` : ""}</tr>`).join("");
    const nums = Array.from({ length: pages }, (_, i) => i + 1).map((n) => `<button type="button" data-t-page="${id}:${n}" ${n === st.page ? 'aria-current="page"' : ""} aria-label="Halaman ${n}">${n}</button>`).join("");
    return `<section class="card table-card">
      <div class="toolbar"><div class="search"><div class="input-ic">${icon("search")}<input class="input" type="search" value="${esc(st.q)}" placeholder="${esc(placeholder)}" aria-label="${esc(placeholder)}" data-t-search="${id}"></div></div>
      ${seg || extra ? `<div class="toolbar-r">${extra}${seg}</div>` : ""}</div>
      ${pageRows.length ? `<div class="table-wrap"><table class="dt"><thead><tr><th class="num-col">No</th>${head}${actions ? '<th class="ta-r">Aksi</th>' : ""}</tr></thead><tbody>${body}</tbody></table></div>`
        : `<div class="empty">${icon(empty.icon)}<h3>${rows.length ? `${unit[0].toUpperCase()}${unit.slice(1)} tidak ditemukan` : esc(empty.title)}</h3><p>${rows.length ? "Coba kata kunci atau filter lain." : esc(empty.description)}</p></div>`}
      <div class="pager"><span class="pg-info">${sorted.length ? `Menampilkan <b>${start}–${end}</b> dari <b>${sorted.length}</b> ${esc(unit)}` : "Tidak ada data"}</span>
      <div class="pager-r"><span class="pg-size"><span>Tampilkan</span><select class="select" data-t-size="${id}" aria-label="Jumlah baris per halaman">${[10, 25, 50].map((n) => `<option ${n === st.size ? "selected" : ""}>${n}</option>`).join("")}</select></span>
      <nav class="pages" aria-label="Halaman"><button type="button" class="pg-nav" data-t-page="${id}:${st.page - 1}" ${st.page <= 1 ? "disabled" : ""} aria-label="Halaman sebelumnya">${icon("chevronLeft")}</button>${nums}<button type="button" class="pg-nav" data-t-page="${id}:${st.page + 1}" ${st.page >= pages ? "disabled" : ""} aria-label="Halaman berikutnya">${icon("chevronRight")}</button></nav></div></div>
    </section>`;
  }

  const pageHead = (title, description, actions = "") => `<div class="page-head"><div><h1>${esc(title)}</h1>${description ? `<p>${esc(description)}</p>` : ""}</div>${actions}</div>`;
  const act = (iconName, label, attr, tone = "") => `<button type="button" class="act${tone ? ` ${tone}` : ""}" aria-label="${esc(label)}" title="${esc(label)}" ${attr}>${icon(iconName)}</button>`;
  const actLink = (iconName, label, href, tone = "") => `<a class="act${tone ? ` ${tone}` : ""}" href="${href}" aria-label="${esc(label)}" title="${esc(label)}">${icon(iconName)}</a>`;
  const cell = (main, sub) => `<div class="cell-main">${main}</div>${sub ? `<div class="cell-sub">${sub}</div>` : ""}`;

  function dayNav(date, base) {
    return `<div class="day-nav">
      <button type="button" class="btn btn-secondary btn-sm" data-go="${base}" ${date === today() ? "disabled" : ""}>${icon("calendarDays")}Hari ini</button>
      <button type="button" class="act" aria-label="Hari sebelumnya" title="Hari sebelumnya" data-go="${base}?tanggal=${addDays(date, -1)}">${icon("chevronLeft")}</button>
      <input class="input" type="date" value="${date}" aria-label="Pilih tanggal" data-date-base="${base}">
      <button type="button" class="act" aria-label="Hari berikutnya" title="Hari berikutnya" data-go="${base}?tanggal=${addDays(date, 1)}">${icon("chevronRight")}</button>
    </div>`;
  }

  function viewHome(params) {
    const date = /^\d{4}-\d{2}-\d{2}$/.test(params.get("tanggal") || "") ? params.get("tanggal") : today();
    const isToday = date === today();
    const nm = nowMin();
    const canBook = date >= today();
    const closed = new Date(`${date}T00:00:00`).getDay() === 0 ? "Hari Minggu bukan hari operasional" : null;
    const list = db.bookings.filter((b) => b.date === date && (ACTIVE.includes(b.status) || statusOf(b) === "done")).sort((a, b) => a.start - b.start);
    const activeRooms = db.rooms.filter((r) => r.status === "active");
    const busy = isToday ? activeRooms.filter((r) => list.some((b) => b.roomId === r.id && statusOf(b) !== "done" && b.start <= nm && b.end > nm)).length : 0;
    const cards = db.rooms.map((r) => {
      const rl = list.filter((b) => b.roomId === r.id && statusOf(b) !== "done");
      const current = isToday ? rl.find((b) => b.start <= nm && b.end > nm) : null;
      const next = rl.find((b) => b.start >= (isToday ? nm : 0));
      const unavailable = r.status !== "active";
      const shut = (isToday && nm >= CLOSE) || closed;
      let state = rl.length ? `${rl.length} booking` : "Kosong";
      let tone = rl.length ? "busy" : "ok";
      let note = rl.length ? `Pertama ${clock(rl[0].start)}, ${rl[0].topic}` : "Belum ada booking";
      if (unavailable) { state = "Perbaikan"; tone = "warn"; note = "Sementara tidak bisa dipesan"; }
      else if (current) { state = `Dipakai s/d ${clock(current.end)}`; tone = "busy"; note = current.topic; }
      else if (isToday) { state = shut ? "Tutup" : next ? `Kosong s/d ${clock(next.start)}` : "Kosong"; tone = shut ? "muted" : "ok"; note = next ? `Berikutnya ${next.topic}` : "Tidak ada booking lagi hari ini"; }
      return `<div class="now-card tone-${tone}"><div class="stat-head"><span class="stat-label">${esc(r.name)}</span><span class="n-cap">${r.capacity} orang</span></div>
        <div class="n-state t-${tone}"><i aria-hidden="true"></i>${esc(state)}</div><div class="n-sub">${esc(note)}</div>
        ${canBook && !unavailable && !shut && can("booking") ? `<a class="n-cta" href="#/booking/baru?ruang=${r.id}${isToday ? "" : `&tanggal=${date}`}">${icon("calendarPlus")}Booking ruang ini</a>` : ""}</div>`;
    }).join("");
    const span = CLOSE - OPEN;
    const pct = (m) => ((m - OPEN) / span) * 100;
    const hours = []; for (let m = OPEN; m <= CLOSE; m += 60) hours.push(m);
    const nowPos = isToday && nm > OPEN && nm < CLOSE ? nm : null;
    const rows = db.rooms.map((r) => {
      const blocked = r.status !== "active" || closed;
      const rl = list.filter((b) => b.roomId === r.id);
      const free = !blocked && canBook && can("booking") ? hours.slice(0, -1).map((m) => {
        const e = Math.min(m + 60, CLOSE);
        if ((isToday && e <= nm) || rl.some((b) => b.start < e && b.end > m)) return "";
        return `<a class="tl-free" style="left:${pct(m)}%;width:${pct(e) - pct(m)}%" href="#/booking/baru?ruang=${r.id}&tanggal=${date}&mulai=${toTime(m)}" aria-label="Booking ${esc(r.name)} jam ${clock(m)}"><span>+ ${clock(m)}</span></a>`;
      }).join("") : "";
      const slots = rl.map((b) => {
        const s = statusOf(b);
        const style = `left:${pct(b.start)}%;width:${pct(b.end) - pct(b.start)}%`;
        const inner = `<strong>${esc(b.topic)}</strong><small>${clock(b.start)}–${clock(b.end)}, ${esc(dept(b.departmentId).code)}</small>`;
        const viewable = ROLE[me.role].manage || ROLE[me.role].modes.length || b.requesterId === me.id;
        return viewable ? `<a class="slot s-${s}" style="${style}" href="#/booking/${b.id}" title="${esc(b.topic)}">${inner}</a>` : `<div class="slot s-${s}" style="${style}" title="${esc(b.topic)}">${inner}</div>`;
      }).join("");
      return `<div class="tl-row"><div class="tl-room"><b>${esc(r.name)}</b><span>${r.capacity} orang</span></div>
        <div class="tl-track${blocked ? " blocked" : ""}">${hours.map((m) => `<i class="tl-grid" style="left:${pct(m)}%"></i>`).join("")}${free}
        ${blocked ? `<span class="tl-blocked">${closed ? "Tutup" : "Sedang perbaikan"}</span>` : ""}${slots}${nowPos !== null ? `<i class="now-line" style="left:${pct(nowPos)}%"></i>` : ""}</div></div>`;
    }).join("");
    return `${pageHead("Beranda", isToday ? `${activeRooms.length - busy} dari ${activeRooms.length} ruang sedang kosong. Klik bagian kosong di jadwal untuk langsung booking.` : "Jadwal pemakaian ruang pada tanggal yang dipilih.")}
      <div class="now-strip">${cards}</div>
      <section class="card timeline-card"><div class="card-head"><div><h2>${longDate(date)}</h2><p>${closed ?? `${list.length} booking tercatat`}</p></div>${dayNav(date, "#/")}</div>
      <div class="tl-scroll"><div class="tl"><div class="tl-head"><span></span><div class="tl-hours">${hours.map((m) => `<span style="left:${pct(m)}%">${clock(m)}</span>`).join("")}${nowPos !== null ? `<span class="now-tag" style="left:${pct(nowPos)}%">${clock(nowPos)}</span>` : ""}</div></div>${rows}</div></div>
      <div class="legend"><span><i class="l-approved"></i>Disetujui</span><span><i class="l-pic"></i>Menunggu PJ Ruang</span><span><i class="l-draft"></i>Draft</span><span><i class="l-done"></i>Selesai</span>${canBook ? '<span class="legend-hint">Klik bagian kosong untuk langsung booking.</span>' : ""}</div></section>`;
  }

  function viewBookings() {
    const manage = ROLE[me.role].manage;
    const rows = db.bookings.filter((b) => manage || b.requesterId === me.id);
    const isActive = (b) => ACTIVE.includes(statusOf(b));
    const columns = [
      { key: "when", header: "Tanggal dan waktu", render: (b) => `<div class="cell-main nowrap">${shortDate(b.date)}</div><div class="cell-sub nowrap">${clock(b.start)}–${clock(b.end)}, ${duration(b.end - b.start)}</div>`, sort: (b) => `${b.date}${pad(b.start)}` },
      { key: "room", header: "Ruang", render: (b) => cell(esc(room(b.roomId)?.name ?? "-"), `${room(b.roomId)?.capacity ?? "-"} orang`), sort: (b) => room(b.roomId)?.name ?? "" },

  function viewBookingForm(params) {

    const date = params.get("tanggal") || today();
    const firstFree = () => {
      const from = date === today() ? Math.max(OPEN, Math.ceil(nowMin() / 30) * 30) : OPEN;
      for (let m = from; m + 60 <= CLOSE; m += 30) if (availability({ roomId, date, start: m, end: m + 60 })[0] === "ok") return m;
      return Math.min(from, CLOSE - 60);
    };
    const s = params.get("mulai") ? toMin(params.get("mulai")) : firstFree();
    const defaultDept = (myDepts.find((d) => db.users.some((u) => u.role === "approver" && u.approves.includes(d.id))) || myDepts[0])?.id;
    const opt = (list, sel, fn, placeholder) => `${placeholder ? `<option value="">${placeholder}</option>` : ""}${list.map((x) => `<option value="${x.id}" ${x.id === sel ? "selected" : ""}>${esc(fn(x))}</option>`).join("")}`;
    return pageHead("Booking ruang", "Isi ruang, waktu, dan detail meeting.", `<a class="btn btn-secondary" href="#/booking">${icon("arrowLeft")}Kembali</a>`)
      + `<div id="bf-alert"></div><div id="bf-avail"></div><section class="card"><form id="booking-form" novalidate>

        <div class="field"><label for="bf-date">Tanggal <span class="req">*</span></label><input class="input" type="date" id="bf-date" name="date" min="${today()}" value="${date}"></div>
        <div class="field"><label for="bf-start">Jam mulai <span class="req">*</span></label><input class="input" type="time" id="bf-start" name="start" value="${toTime(s)}"><div class="hint">Jam operasional ${clock(OPEN)}–${clock(CLOSE)}</div></div>
        <div class="field"><label for="bf-end">Jam selesai <span class="req">*</span></label><input class="input" type="time" id="bf-end" name="end" value="${toTime(Math.min(s + 60, CLOSE))}"><div class="hint" id="bf-duration"></div></div>
      </div><h3 class="form-section">Detail meeting</h3>
        <div class="field" id="f-topic"><label for="bf-topic">Topik pembahasan <span class="req">*</span></label><input class="input" id="bf-topic" name="topic" maxlength="120" placeholder="Masukkan topik pembahasan"><div class="hint">Contoh: Evaluasi vendor kuartal ketiga.</div></div>
        <div class="grid2">
          <div class="field"><label for="bf-dept">Departemen <span class="req">*</span></label><select class="select" id="bf-dept" name="departmentId">${opt(myDepts, myDepts.some((d) => d.id === me.departmentId && db.users.some((u) => u.role === "approver" && u.approves.includes(d.id))) ? me.departmentId : defaultDept, (d) => `${d.name} (${d.code})`)}</select></div>
          <div class="field"><label for="bf-approver">Penyetuju yang menyetujui <span class="req">*</span></label><select class="select" id="bf-approver" name="approverId"></select><div class="hint" id="bf-approver-hint"></div></div>
          <div class="field" id="f-participants"><label for="bf-participants">Jumlah peserta</label><input class="input" type="number" id="bf-participants" name="participants" min="1" max="500" placeholder="Masukkan jumlah peserta"><div class="hint" id="bf-capacity"></div></div>
          <div class="field"><span class="label">Teleconference</span><div class="seg" role="group" aria-label="Teleconference"><button type="button" class="active" aria-pressed="true" data-tele="no">Tidak</button><button type="button" aria-pressed="false" data-tele="yes">Ya</button></div></div>
        </div>
        <div class="grid2" id="bf-tele-box" hidden><div class="field"><label for="bf-tele">Aplikasi teleconference <span class="req">*</span></label><select class="select" id="bf-tele" name="tele"><option value="">Pilih aplikasi</option>${TELE_APPS.map((a) => `<option>${a}</option>`).join("")}</select></div></div>
        <div class="field"><label for="bf-notes">Catatan</label><textarea class="textarea" id="bf-notes" name="notes" maxlength="500" placeholder="Masukkan catatan"></textarea><div class="hint">Opsional. Contoh: kebutuhan konsumsi atau perlengkapan tambahan.</div></div>

  function mountBookingForm() {
    const form = document.getElementById("booking-form");
    if (!form) return;
    const $ = (id) => document.getElementById(id);
    let tele = "no";
    const read = () => ({ roomId: Number($("bf-room").value), date: $("bf-date").value, start: $("bf-start").value ? toMin($("bf-start").value) : NaN, end: $("bf-end").value ? toMin($("bf-end").value) : NaN, topic: $("bf-topic").value.trim(), departmentId: Number($("bf-dept").value), approverId: Number($("bf-approver").value), participants: Number($("bf-participants").value) || 0, tele: tele === "yes" ? $("bf-tele").value : "", notes: $("bf-notes").value.trim() });
    const alertBox = (el, message, tone) => { el.innerHTML = message ? `<div class="form-alert ${tone}" role="${tone === "error" ? "alert" : "status"}">${icon({ error: "circleAlert", success: "circleCheck", wait: "clock", info: "info" }[tone])}<span>${esc(message)}</span></div>` : ""; };
    const fillApprovers = () => {
      const list = db.users.filter((u) => u.role === "approver" && u.approves.includes(Number($("bf-dept").value)));
      $("bf-approver").innerHTML = list.map((u) => `<option value="${u.id}">${esc(u.name)} (${esc(u.job)})</option>`).join("") || '<option value="">Belum ada penyetuju</option>';
      $("bf-approver-hint").textContent = list.length ? "" : "Departemen ini belum punya penyetuju. Hubungi administrator.";
    };
    const check = () => {
      const v = read();
      const [state, message] = availability(v);
      alertBox($("bf-avail"), message, { ok: "success", bad: "error", wait: "wait" }[state]);
      const r = room(v.roomId);
      $("bf-capacity").textContent = r ? `Kapasitas ${r.name} ${r.capacity} orang` : "";
      $("bf-duration").textContent = v.end > v.start ? `Durasi ${duration(v.end - v.start)}` : "";
      return state === "ok";
    };
    const setError = (fieldId, message) => {
      const f = $(fieldId); f.classList.add("invalid");
      f.querySelector(".hint, .err")?.remove();
      f.insertAdjacentHTML("beforeend", `<div class="err" role="alert">${esc(message)}</div>`);
    };
    fillApprovers(); check();
    $("bf-dept").addEventListener("change", fillApprovers);
    form.addEventListener("input", check);
    form.addEventListener("change", check);
    form.querySelectorAll("[data-tele]").forEach((b) => b.addEventListener("click", () => {
      tele = b.dataset.tele;
      form.querySelectorAll("[data-tele]").forEach((x) => { x.classList.toggle("active", x === b); x.setAttribute("aria-pressed", String(x === b)); });
      $("bf-tele-box").hidden = tele !== "yes";
    }));
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const v = read();
      let bad = false;
      if (v.topic.length < 3) { setError("f-topic", "Isi topik minimal 3 karakter."); bad = true; }
      const r = room(v.roomId);
      if (r && v.participants > r.capacity) { setError("f-participants", `Peserta melebihi kapasitas ${r.capacity} orang.`); bad = true; }
      if (tele === "yes" && !v.tele) { bad = true; alertBox($("bf-alert"), "Pilih aplikasi teleconference.", "error"); }
      if (!v.approverId) bad = true;
      if (!check() || bad) { if (!$("bf-alert").innerHTML) alertBox($("bf-alert"), "Periksa kembali isian yang ditandai merah.", "error"); window.scrollTo({ top: 0 }); return; }
      const isPic = r.picId === me.id;
      const b = { id: db.seq.booking++, ...v, participants: v.participants || 1, requesterId: me.id, status: isPic ? "approved" : "draft", events: [{ label: "Diajukan", actor: me.name, at: stamp() }] };
      if (isPic) b.events.push({ label: "Dicek Penanggung Jawab Ruang", actor: me.name, at: stamp(), note: "Dipesan langsung oleh Penanggung Jawab Ruang ini." });
      db.bookings.push(b);
      if (!isPic) notifyUsers([v.approverId], "Booking menunggu persetujuan", `${v.topic} · ${r.name}`, "#/persetujuan?tahap=approver");
      log("Ajukan", "info", "Booking", `${v.topic} · ${r.name}`);
      persist();
      location.hash = `#/booking/${b.id}`;
      setTimeout(() => statusModal(isPic ? "Booking langsung disetujui karena Anda Penanggung Jawab Ruang ini." : "Booking diajukan dan menunggu persetujuan penyetuju.", "success"));
    });
  }

  function viewMonitoring(params) {
    const date = /^\d{4}-\d{2}-\d{2}$/.test(params.get("tanggal") || "") ? params.get("tanggal") : today();
    const used = db.bookings.filter((b) => b.date === date && ["approved", "pic", "draft", "done"].includes(statusOf(b)));
    const span = CLOSE - OPEN;
    const data = db.rooms.map((r) => { const rb = used.filter((b) => b.roomId === r.id); const m = rb.reduce((s, b) => s + b.end - b.start, 0); return { ...r, count: rb.length, minutes: m, occupancy: Math.round((m / span) * 100) }; });
    const total = data.reduce((s, r) => s + r.minutes, 0);
    const activeRows = data.filter((r) => r.status === "active");
    const avg = activeRows.length ? Math.round(activeRows.reduce((s, r) => s + r.occupancy, 0) / activeRows.length) : 0;
    const busiest = [...data].sort((a, b) => b.minutes - a.minutes)[0];
    const stat = (label, value, note, ic, tone) => `<div class="stat-card tone-${tone}"><div class="stat-head"><span class="stat-label">${label}</span><span class="stat-ic">${icon(ic)}</span></div><div class="stat-value">${esc(value)}</div><div class="stat-note">${esc(note)}</div></div>`;
    const columns = [
      { key: "room", header: "Ruang", render: (r) => cell(esc(r.name), `${r.capacity} orang`), sort: (r) => r.name },
      { key: "dept", header: "Departemen", render: (r) => esc(dept(r.departmentId)?.code ?? "-") },
      { key: "count", header: "Jumlah booking", render: (r) => `<span class="mono">${r.count} booking</span>`, sort: (r) => r.count, cls: "nowrap" },
      { key: "minutes", header: "Total pemakaian", render: (r) => (r.minutes ? duration(r.minutes) : "-"), sort: (r) => r.minutes, cls: "nowrap" },
      { key: "occ", header: "Tingkat pemakaian", render: (r) => `<div class="occ"><span class="occ-bar"><i style="width:${Math.min(100, r.occupancy)}%"></i></span><span class="mono">${r.occupancy}%</span></div>`, sort: (r) => r.occupancy },
      { key: "status", header: "Status", render: (r) => (r.status === "active" ? badge("Aktif", "ok") : badge("Perbaikan", "warn")) },
    ];
    return pageHead("Monitoring", `Pemakaian ruang pada ${longDate(date)}.`)
      + `<div class="stat-grid">${stat("Total booking", String(used.length), "Tidak termasuk yang batal atau ditolak", "calendarCheck", "blue")}${stat("Total pemakaian", total ? duration(total) : "0 jam", "Semua ruang", "clock", "green")}${stat("Rata-rata tingkat pemakaian", `${avg}%`, `Dari jam operasional ${clock(OPEN)}–${clock(CLOSE)}`, "gauge", "amber")}${stat("Ruang tersibuk", busiest && busiest.minutes ? busiest.name : "-", busiest && busiest.minutes ? duration(busiest.minutes) : `${activeRows.length} ruang aktif`, "door", "violet")}</div>`
      + table("monitoring", { rows: data, columns, unit: "ruang", placeholder: "Cari ruang", searchText: (r) => r.name, extra: dayNav(date, "#/monitoring"), empty: { icon: "door", title: "Belum ada ruangan", description: "Tambahkan ruangan di Master." } });
  }

    const form = document.getElementById("room-form");
    if (!form) return;
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const id = Number(form.dataset.id) || null;
      const f = new FormData(form);
      const v = { name: String(f.get("name")).trim(), location: String(f.get("location")).trim(), capacity: Number(f.get("capacity")), departmentId: Number(f.get("departmentId")), status: String(f.get("status")), facilities: String(f.get("facilities")).trim() };
      const errors = {};
      if (v.name.length < 3) errors["f-name"] = "Nama ruang minimal 3 karakter.";
      else if (db.rooms.some((x) => x.id !== id && x.name.toLowerCase() === v.name.toLowerCase())) errors["f-name"] = "Nama ruang sudah dipakai.";
      if (!v.location) errors["f-loc"] = "Isi lokasi ruang.";
      if (!(v.capacity >= 1)) errors["f-cap"] = "Kapasitas minimal 1 orang.";
      form.querySelectorAll(".field.invalid").forEach((el) => { el.classList.remove("invalid"); el.querySelector(".err")?.remove(); });
      for (const [fid, msg] of Object.entries(errors)) { const el = document.getElementById(fid); el.classList.add("invalid"); el.querySelector(".hint")?.remove(); el.insertAdjacentHTML("beforeend", `<div class="err" role="alert">${esc(msg)}</div>`); }
      if (Object.keys(errors).length) { document.getElementById("rf-alert").innerHTML = `<div class="form-alert error" role="alert">${icon("circleAlert")}<span>Periksa kembali isian yang ditandai merah.</span></div>`; return; }
      confirmDialog({
        title: id ? "Simpan perubahan ruangan?" : "Simpan ruangan baru?", description: `${v.name}, ${v.location}, ${v.capacity} orang.`, label: id ? "Simpan perubahan" : "Simpan", iconName: "save", tone: "primary",
        onConfirm: () => {
          if (id) { Object.assign(room(id), v); log("Ubah", "info", "Ruangan", v.name); }
          else { db.rooms.push({ id: db.seq.room++, picId: 4, ...v }); log("Tambah", "ok", "Ruangan", v.name); }
          location.hash = "#/master/ruangan";
          return id ? "Perubahan ruangan disimpan." : "Ruangan ditambahkan.";
        },
      });
    });
  }

  function viewDepartments() {
    const columns = [
      { key: "name", header: "Departemen", render: (d) => cell(esc(d.name), esc(d.code)), sort: (d) => d.name },
      { key: "users", header: "Pengguna", render: (d) => `${db.users.filter((u) => u.departmentId === d.id).length} orang`, sort: (d) => db.users.filter((u) => u.departmentId === d.id).length, cls: "nowrap" },
      { key: "status", header: "Status", render: (d) => (d.active ? badge("Aktif", "ok") : badge("Nonaktif", "bad")) },
    ];
    return pageHead("Departemen", "Daftar departemen untuk pengguna, ruangan, dan penyetuju. Di demo ini daftar departemen hanya untuk dilihat.")
      + table("departments", { rows: db.departments, columns, unit: "departemen", placeholder: "Cari nama atau kode departemen", searchText: (d) => `${d.name} ${d.code}`, empty: { icon: "building", title: "Belum ada departemen", description: "" } });
  }

  function viewUsers() {
    const columns = [
      { key: "name", header: "Pengguna", render: (u) => cell(esc(u.name), esc(u.email)), sort: (u) => u.name },
      { key: "dept", header: "Departemen", render: (u) => `${esc(dept(u.departmentId).name)} (${esc(dept(u.departmentId).code)})`, sort: (u) => dept(u.departmentId).name },
      { key: "job", header: "Jabatan", render: (u) => esc(u.job) },
      { key: "role", header: "Hak akses", render: (u) => badge(ROLE[u.role].label, "info"), sort: (u) => ROLE[u.role].label },
      { key: "status", header: "Status", render: () => badge("Aktif", "ok") },
    ];
    return pageHead("Pengguna", "Akun yang bisa masuk ke Meeting Room Booking. Di demo ini daftar pengguna hanya untuk dilihat.")
      + table("users", { rows: db.users, columns, unit: "pengguna", placeholder: "Cari nama, email, atau departemen", searchText: (u) => [u.name, u.email, dept(u.departmentId).name].join(" "), empty: { icon: "users", title: "Belum ada pengguna", description: "" } });
  }

  function viewActivity() {
    const columns = [
      { key: "at", header: "Waktu", render: (a) => esc(a.at), cls: "nowrap" },
      { key: "user", header: "Pengguna", render: (a) => esc(a.user), sort: (a) => a.user },
      { key: "action", header: "Aksi", render: (a) => badge(a.action, a.tone), sort: (a) => a.action },
      { key: "module", header: "Modul", render: (a) => esc(a.module), sort: (a) => a.module, cls: "nowrap" },
      { key: "target", header: "Data", render: (a) => cell(esc(a.target), esc(a.detail)) },
    ];
    const isAuth = (a) => a.module === "Login dan sesi";
    return pageHead("Riwayat aktivitas", "Catatan login, login gagal, booking, persetujuan, dan perubahan data. Coba login dengan password salah, lalu lihat catatannya di sini.")
      + table("activity", {
        rows: db.activity, columns, unit: "aktivitas", placeholder: "Cari pengguna atau data",
        searchText: (a) => [a.user, a.target, a.detail, a.module].join(" "),
        filters: [{ value: "all", label: "Semua", test: () => true }, { value: "change", label: "Perubahan data", test: (a) => !isAuth(a) }, { value: "auth", label: "Login dan sesi", test: isAuth }, { value: "failed", label: "Login gagal", test: (a) => a.action === "Login gagal" }],
        empty: { icon: "history", title: "Belum ada aktivitas", description: "" },
      });
  }

  function viewLogin(message = "") {
    return `<main class="login"><div class="login-glow" aria-hidden="true"></div><div class="login-main">
      <div class="login-brand">${BRAND_MARK(true)}<div class="login-word"><b>Meeting Room</b><small>Booking</small></div></div>
      ${message ? `<div class="form-alert error" role="alert">${icon("circleAlert")}<span>${esc(message)}</span></div>` : ""}
      <section class="card login-card"><div class="card-body"><h1>Selamat datang</h1><p class="lead">Masuk untuk memesan ruang meeting.</p>
      <form id="login-form" novalidate>
        <div class="field"><label for="login-email">Email</label><div class="input-ic">${icon("atSign")}<input class="input" id="login-email" name="email" type="email" autocomplete="email" placeholder="Masukkan email"></div></div>
        <div class="field"><label for="login-password">Password</label><input class="input" id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Masukkan password"></div>
        <div class="login-row"><label class="check"><input type="checkbox" name="remember">Ingat saya</label><button type="button" class="link-icon" data-action="forgot">${icon("circleHelp")}Lupa password?</button></div>
        <button type="submit" class="btn btn-primary">${icon("logIn")}Masuk</button>
      </form>
      <div class="demo-accounts"><h2>Akun demo · password ${PASSWORD}</h2>${db.users.map((u) => `<button type="button" class="demo-account" data-fill="${u.email}"><span><b>${esc(ROLE[u.role].label)}</b><small>${esc(u.email)}</small></span><small>Isi otomatis</small></button>`).join("")}</div>
      </div></section><p class="login-meta">© 2026 Fedy Fs. Gerana · Versi demo</p></div></main>`;
  }

  function navLinks(route) {
    const pages = ROLE[me.role].pages;
    const pending = ROLE[me.role].modes.reduce((n, m) => n + approvalQueue(m).length, 0);
    return NAV.map((item) => {
      if (item.children) {
        const children = item.children.filter((c) => pages.includes(c.page));
        if (!children.length) return "";
        const active = children.some((c) => c.page === route.page);
        const open = ui.menu === item.key;
        return `<div class="nav-group"><button type="button" class="tab${active ? " active" : ""}" aria-haspopup="true" aria-expanded="${open}" data-menu="${item.key}">${icon(item.icon)}${item.label}${icon("chevronDown", "caret")}</button>
          ${open ? `<div class="nav-drop">${children.map((c) => `<a href="${c.href}" class="${c.page === route.page ? "active" : ""}">${icon(c.icon)}${c.label}</a>`).join("")}</div>` : ""}</div>`;
      }
      if (!pages.includes(item.page)) return "";
      const active = item.page === route.page;
      return `<a href="${item.href}" class="tab${active ? " active" : ""}" ${active ? 'aria-current="page"' : ""}>${icon(item.icon)}${item.label}${item.page === "approvals" && pending ? `<span class="num">${pending}</span>` : ""}</a>`;
    }).join("");
  }

  function bottomNav(route) {
    const pages = ROLE[me.role].pages;
    const main = NAV.filter((i) => !i.children && pages.includes(i.page));
    const more = NAV.filter((i) => i.children).map((g) => ({ title: g.label, links: g.children.filter((c) => pages.includes(c.page)) })).filter((g) => g.links.length);
    return `<nav class="bottom-nav" aria-label="Menu utama">${main.map((i) => `<a href="${i.href}" class="${i.page === route.page ? "active" : ""}">${icon(i.icon)}${i.short ?? i.label}</a>`).join("")}
      ${more.length ? `<button type="button" data-action="more" class="${more.some((g) => g.links.some((l) => l.page === route.page)) ? "active" : ""}">${icon("menu")}Lainnya</button>` : ""}</nav>`;
  }

  function moreSheet() {
    const pages = ROLE[me.role].pages;
    const groups = NAV.filter((i) => i.children).map((g) => ({ title: g.label, links: g.children.filter((c) => pages.includes(c.page)) })).filter((g) => g.links.length);
    layer.innerHTML = `<div class="backdrop" data-close><div class="modal sheet-modal" role="dialog" aria-modal="true" aria-label="Menu lainnya"><div class="sheet-handle" aria-hidden="true"></div><div class="sheet">${groups.map((g) => `<div><h3>${g.title}</h3><div class="sheet-list">${g.links.map((l) => `<a href="${l.href}" data-close-link>${icon(l.icon)}${l.label}</a>`).join("")}</div></div>`).join("")}</div></div></div>`;
  }

  function topbarRight() {
    const mine = db.notifications.filter((n) => n.userId === me.id);
    const unread = mine.filter((n) => !n.read).length;
    const tone = avatarTone(me.name);
    const d = dept(me.departmentId);
    const notif = `<div class="notif"><button type="button" class="notif-btn" aria-haspopup="true" aria-expanded="${ui.menu === "notif"}" aria-label="Notifikasi" title="Notifikasi" data-menu="notif">${icon("bell")}${unread ? `<span class="notif-count">${unread}</span>` : ""}</button>
      ${ui.menu === "notif" ? `<div class="notif-panel" role="dialog" aria-label="Notifikasi"><div class="notif-head"><b>Notifikasi</b>${unread ? `<button type="button" class="link-icon" data-action="read-all">${icon("checkCheck")}Tandai semua dibaca</button>` : ""}</div>
        ${mine.length ? `<ul class="notif-list">${mine.slice(0, 20).map((n) => `<li><button type="button" class="notif-item${n.read ? "" : " unread"}" data-note="${n.id}"><span class="notif-ic">${icon("clipboardCheck")}</span><span class="notif-text"><b>${esc(n.title)}</b><span>${esc(n.body)}</span><small>${esc(n.at)}</small></span>${n.read ? "" : '<i class="notif-dot" aria-label="Belum dibaca"></i>'}</button></li>`).join("")}</ul>` : `<div class="notif-empty">${icon("bellOff")}Belum ada notifikasi.</div>`}</div>` : ""}</div>`;
    const account = `<div class="user-menu"><button type="button" class="user-btn" aria-haspopup="true" aria-expanded="${ui.menu === "account"}" data-menu="account"><span class="avatar avatar-solid ${tone}">${initials(me.name)}</span><span class="u-text"><span class="u-name">${esc(me.name)}</span><span class="u-role">${ROLE[me.role].label}</span></span>${icon("chevronDown", "u-caret")}</button>
      ${ui.menu === "account" ? `<div class="account" role="dialog" aria-label="Akun"><div class="acc-head"><span class="avatar avatar-solid ${tone}">${initials(me.name)}</span><div><div class="who">${esc(me.name)}</div><div class="what">${esc(me.email)}</div></div></div><div class="sep"></div>
        <ul class="acc-meta"><li title="Jabatan">${icon("briefcase")}<span>${esc(me.job)}</span></li><li title="Departemen">${icon("building")}<span>${esc(d.name)} (${esc(d.code)})</span></li><li title="Akses">${icon("shieldCheck")}<span>${ROLE[me.role].label}</span></li></ul><div class="sep"></div>
        <div class="theme-seg" role="group" aria-label="Tema tampilan">${[["system", "Sistem", "laptop"], ["light", "Terang", "sun"], ["dark", "Gelap", "moon"]].map(([v, l, ic]) => `<button type="button" aria-pressed="${ui.theme === v}" data-theme-set="${v}">${icon(ic)}${l}</button>`).join("")}</div><div class="sep"></div>
        <button type="button" class="logout" data-action="logout">${icon("logOut")}Keluar</button></div>` : ""}</div>`;
    return notif + account;
  }

  function parseRoute() {
    const raw = location.hash.replace(/^#/, "") || "/";
    const [path, query = ""] = raw.split("?");
    const params = new URLSearchParams(query);
    let m;
    if (path === "/") return { page: "home", view: () => viewHome(params) };
    if (path === "/booking") return { page: "booking", view: viewBookings };
    if (path === "/booking/baru") return { page: "booking", view: () => viewBookingForm(params), mount: mountBookingForm };
    if ((m = path.match(/^\/booking\/(\d+)$/))) return { page: "booking", view: () => viewBookingDetail(Number(m[1])) };
    if (path === "/persetujuan") return { page: "approvals", view: () => viewApprovals(params) };
    if (path === "/monitoring") return { page: "monitoring", view: () => viewMonitoring(params) };
    if (path === "/master/ruangan") return { page: "rooms", view: viewRooms };
    if (path === "/master/ruangan/tambah") return { page: "rooms", view: () => viewRoomForm(null), mount: mountRoomForm };
    if ((m = path.match(/^\/master\/ruangan\/(\d+)$/))) return { page: "rooms", view: () => viewRoomForm(Number(m[1])), mount: mountRoomForm };
    if (path === "/master/departemen") return { page: "departments", view: viewDepartments };
    if (path === "/master/pengguna") return { page: "users", view: viewUsers };
    if (path === "/pengaturan/riwayat-aktivitas") return { page: "activity", view: viewActivity };
    return { page: "home", view: () => viewHome(params) };
  }

  function render() {
    closeLayer();
    const app = document.getElementById("app");
    if (!me) { app.innerHTML = viewLogin(ui.loginError); ui.loginError = ""; document.title = "Masuk — Meeting Room Booking (demo)"; return document.getElementById("login-email")?.focus(); }
    let route = parseRoute();
    if (!can(route.page)) { route = { page: "home", view: () => viewHome(new URLSearchParams()) }; }
    app.innerHTML = `<div class="app"><header class="app-header"><div class="topbar"><div class="wrap topbar-in"><a href="#/" aria-label="Meeting Room Booking, ke Beranda"><span class="brand">${BRAND_MARK(false)}<span class="brand-word"><b>Meeting Room</b><small>Booking</small></span></span></a><div class="topbar-r">${topbarRight()}</div></div></div>
      <nav class="navbar" aria-label="Menu utama"><div class="wrap navbar-in"><div class="nav">${navLinks(route)}</div></div></nav></header>
      <main class="wrap app-main">${route.view()}</main>
      <footer class="footer"><div class="wrap footer-in"><span>© 2026 Fedy Fs. Gerana</span><span>Meeting Room Booking versi demo</span></div></footer>${bottomNav(route)}</div>`;
    route.mount?.();
    document.title = `${{ home: "Beranda", booking: "Booking Ruang", approvals: "Persetujuan", monitoring: "Monitoring", rooms: "Ruangan", departments: "Departemen", users: "Pengguna", activity: "Riwayat aktivitas" }[route.page]} — Meeting Room Booking (demo)`;
  }

  function rerenderKeepFocus(selector) {
    const pos = document.activeElement?.selectionStart;
    render();
    const el = document.querySelector(selector);
    if (el) { el.focus(); if (pos != null) el.setSelectionRange(pos, pos); }
  }

  document.addEventListener("submit", (e) => {
    if (e.target.id !== "login-form") return;
    e.preventDefault();
    const f = new FormData(e.target);
    const email = String(f.get("email")).trim().toLowerCase();
    const password = String(f.get("password"));
    if (!email || !password) { ui.loginError = "Isi email dan password."; return render(); }
    const found = db.users.find((u) => u.email === email);
    if (!found || password !== PASSWORD) {
      db.activity.unshift({ at: stamp(), user: found ? found.name : "-", action: "Login gagal", tone: "bad", module: "Login dan sesi", target: email, detail: found ? "Password salah" : "Akun tidak ditemukan" });
      persist(); ui.loginError = "Email atau password salah."; return render();
    }
    me = found;
    sessionStorage.setItem(SESSION, String(found.id));
    log("Login", "ok", "Login dan sesi", found.name);
    persist();
    if (location.hash === "#/" || !location.hash) render(); else location.hash = "#/";
  });

  document.addEventListener("click", (e) => {
    const closer = e.target.closest("[data-close]");
    if (closer && (!closer.classList.contains("backdrop") || e.target === closer)) { closeLayer(); return; }
    const el = e.target.closest("button, a");
    if (!el) { if (ui.menu && !e.target.closest(".nav-group, .notif, .user-menu")) { ui.menu = null; render(); } return; }
    const d = el.dataset;
    if (d.action === "reset-demo") { db = seed(); persist(); me = null; sessionStorage.removeItem(SESSION); ui.tables = {}; location.hash = "#/"; render(); statusModal("Data demo dikembalikan seperti semula.", "info"); return; }
    if (d.fill) { document.getElementById("login-email").value = d.fill; document.getElementById("login-password").value = PASSWORD; document.getElementById("login-password").focus(); return; }
    if (d.action === "forgot") { statusModal("Di aplikasi asli, hubungi administrator untuk mengatur ulang password. Di demo ini semua akun memakai password demo1234.", "info"); return; }
    if (!me) return;
    if (ui.menu && !el.closest(".nav-group, .notif, .user-menu") && !d.menu) ui.menu = null;
    if (d.menu) { ui.menu = ui.menu === d.menu ? null : d.menu; return render(); }
    if (el.tagName === "A" && el.getAttribute("href")?.startsWith("#")) { ui.menu = null; if (el.getAttribute("href") === location.hash) render(); return; }
    if (d.themeSet) { applyTheme(d.themeSet); return render(); }
    if (d.action === "logout") { ui.menu = null; render(); return confirmLogout(); }
    if (d.action === "read-all") { db.notifications.forEach((n) => { if (n.userId === me.id) n.read = true; }); persist(); return render(); }
    if (d.note) { const n = db.notifications.find((x) => x.id === Number(d.note)); n.read = true; persist(); ui.menu = null; if (location.hash === n.href) render(); else location.hash = n.href; return; }
    if (d.action === "more") return moreSheet();
    if (d.go) { location.hash = d.go; return; }
    if (d.cancel) return cancelBooking(Number(d.cancel));
    if (d.approve) { const [id, mode] = d.approve.split(":"); return decide(Number(id), mode, true); }
    if (d.reject) { const [id, mode] = d.reject.split(":"); return decide(Number(id), mode, false); }
    if (d.deleteRoom) return deleteRoom(Number(d.deleteRoom));
    if (d.tFilter) { const [id, v] = d.tFilter.split(":"); ui.tables[id].filter = v; ui.tables[id].page = 1; return render(); }
    if (d.tSort) { const [id, key] = d.tSort.split(":"); const st = ui.tables[id]; st.sort = !st.sort || st.sort.key !== key ? { key, dir: "asc" } : st.sort.dir === "asc" ? { key, dir: "desc" } : null; return render(); }
    if (d.tPage) { const [id, p] = d.tPage.split(":"); ui.tables[id].page = Number(p); return render(); }
  });

  document.addEventListener("input", (e) => {
    const id = e.target.dataset?.tSearch;
    if (id) { ui.tables[id].q = e.target.value; ui.tables[id].page = 1; rerenderKeepFocus(`[data-t-search="${id}"]`); }
  });
  document.addEventListener("change", (e) => {
    const d = e.target.dataset || {};
    if (d.tSize) { ui.tables[d.tSize].size = Number(e.target.value); ui.tables[d.tSize].page = 1; render(); }
    if (d.dateBase && e.target.value) location.hash = e.target.value === today() ? d.dateBase : `${d.dateBase}?tanggal=${e.target.value}`;
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (layer.innerHTML) closeLayer(); else if (ui.menu) { ui.menu = null; render(); } } });
  window.addEventListener("hashchange", () => { ui.menu = null; render(); window.scrollTo({ top: 0 }); });

  me = db.users.find((u) => u.id === Number(sessionStorage.getItem(SESSION))) || null;
  render();
})();
</script>
</body>
</html>
