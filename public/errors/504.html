<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Server terlalu lama merespons — Meeting Room Booking</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        font-family:
          "Hanken Grotesk",
          -apple-system,
          "Segoe UI",
          Arial,
          sans-serif;
        color: #171a20;
        background: linear-gradient(
          180deg,
          #ffffff 0%,
          #eef1f6 50%,
          #dce2eb 100%
        );
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 28px 40px;
      }
      header b {
        display: block;
        font-size: 16px;
        line-height: 1;
        letter-spacing: 0.02em;
      }
      header small {
        display: block;
        margin-top: 3px;
        font-size: 12px;
        line-height: 1;
        color: #5c5e62;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 24px 80px;
        text-align: center;
      }
      .code {
        font-size: 128px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.04em;
      }
      h1 {
        margin-top: 20px;
        font-size: 28px;
        line-height: 34px;
        font-weight: 500;
      }
      p {
        max-width: 480px;
        margin-top: 10px;
        font-size: 15px;
        line-height: 22px;
        color: #5c5e62;
      }
      button {
        margin-top: 28px;
        height: 40px;
        padding: 0 16px;
        border: 0;
        border-radius: 4px;
        background: #3e6ae1;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        color: #ffffff;
        cursor: pointer;
      }
      button:hover {
        background: #3458c2;
      }
      footer {
        padding: 0 40px 24px;
        text-align: center;
        font-size: 12px;
        color: #5c5e62;
      }
      @media (max-width: 767px) {
        header {
          padding: 20px 16px;
        }
        .code {
          font-size: 88px;
        }
        h1 {
          font-size: 22px;
          line-height: 28px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <svg width="36" height="36" viewBox="0 0 40 40" aria-hidden="true">
        <rect width="40" height="40" rx="10" fill="#3E6AE1"/>
        <rect x="10" y="12" width="20" height="18" rx="3.5" fill="none" stroke="#FFFFFF" stroke-width="2.4"/>
        <path d="M10 17.5h20M15 9.5v4.5M25 9.5v4.5" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M15.6 23.6l2.9 2.9 5.9-5.9" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div><b>Meeting Room</b><small>Booking</small></div>
    </header>
    <main>
      <div class="code" aria-hidden="true">504</div>
      <h1>Server terlalu lama merespons</h1>
      <p>
        Permintaan Anda membutuhkan waktu lebih lama dari biasanya. Coba lagi
        beberapa saat lagi.
      </p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </main>
    <footer>© 2026 Fedy Fs. Gerana · Versi 1.0.0</footer>
  </body>
</html>
